spring.application.name=swissotel-360

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.hibernate.naming.physical-strategy=com.swissotel.swissotel360.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=This is the Exercise 3 API
documentation.application.version=1.0.0

authorization.jwt.secret=
authorization.jwt.expiration.days=7
