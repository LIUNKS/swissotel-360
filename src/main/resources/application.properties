spring.application.name=swissotel-360

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.hibernate.naming.physical-strategy=com.swissotel.swissotel360.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Swissotel 360 Hotel Operations & Booking REST API
documentation.application.version=1.0.0

reservations.pending-hold-minutes=15
reservations.max-nights=30
reservations.expiration-job.enabled=true
reservations.expiration-job.fixed-delay-ms=60000

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7
authorization.cookie.secure=${COOKIE_SECURE:false}
authorization.cookie.same-site=${COOKIE_SAME_SITE:Lax}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080}
