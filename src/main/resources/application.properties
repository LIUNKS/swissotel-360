spring.application.name=swissotel-360

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Esta es la API del Ejercicio 3
documentation.application.version=1.0.0


authorization.jwt.secret=esta-es-una-clave-secreta-muy-larga-y-completamente-indescifrable-para-proteger-los-tokens
authorization.jwt.expiration.days=7
