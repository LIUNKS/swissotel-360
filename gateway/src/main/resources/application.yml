server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: billing-service
              uri: ${gateway.routes.billing-service-url}
              predicates:
                - Path=/api/v1/folios/**,/api/v1/payments/**,/api/v1/payment-methods/**,/api/v1/invoices/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: iam-service
              uri: ${gateway.routes.iam-service-url}
              predicates:
                - Path=/api/v1/authentication/**,/api/v1/users/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: guests-service
              uri: ${gateway.routes.guests-service-url}
              predicates:
                - Path=/api/v1/guests/**,/api/v1/document-types/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: rooms-service
              uri: ${gateway.routes.rooms-service-url}
              predicates:
                - Path=/api/v1/rooms/**,/api/v1/room-types/**,/api/v1/availability/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: reservations-service
              uri: ${gateway.routes.reservations-service-url}
              predicates:
                - Path=/api/v1/reservations/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: operations-service
              uri: ${gateway.routes.operations-service-url}
              predicates:
                - Path=/api/v1/stays/**,/api/v1/digital-keys/**,/api/v1/service-requests/**,/api/v1/service-types/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: billing-openapi
              uri: ${gateway.routes.billing-service-url}
              predicates:
                - Path=/v3/api-docs/billing
              filters:
                - RewritePath=/v3/api-docs/billing, /v3/api-docs
            - id: monolith-openapi
              uri: ${gateway.routes.monolith-url}
              predicates:
                - Path=/v3/api-docs/monolith
              filters:
                - RewritePath=/v3/api-docs/monolith, /v3/api-docs

gateway:
  routes:
    monolith-url: ${MONOLITH_URL:http://localhost:8081}
    iam-service-url: ${IAM_SERVICE_URL:${gateway.routes.monolith-url}}
    guests-service-url: ${GUESTS_SERVICE_URL:${gateway.routes.monolith-url}}
    rooms-service-url: ${ROOMS_SERVICE_URL:${gateway.routes.monolith-url}}
    reservations-service-url: ${RESERVATIONS_SERVICE_URL:${gateway.routes.monolith-url}}
    operations-service-url: ${OPERATIONS_SERVICE_URL:${gateway.routes.monolith-url}}
    billing-service-url: ${BILLING_SERVICE_URL:http://localhost:8086}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Monolith (IAM, Guests, Rooms, Reservations, Operations)
        url: /v3/api-docs/monolith
      - name: Billing Service
        url: /v3/api-docs/billing

management:
  endpoints:
    web:
      exposure:
        include: health,info

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080}
