spring.application.name=operations-service
server.port=${OPERATIONS_SERVICE_PORT:8085}

spring.datasource.url=${OPERATIONS_DB_URL:jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5433}/${LOCAL_DB_NAME:swissotel360}?currentSchema=operations,extensions}
spring.datasource.username=${OPERATIONS_DB_USERNAME:${LOCAL_DB_USER:swissotel}}
spring.datasource.password=${OPERATIONS_DB_PASSWORD:${LOCAL_DB_PASSWORD:swissotel_dev_password}}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.naming.physical-strategy=com.swissotel.swissotel360.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=operations
spring.flyway.default-schema=operations
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:swissotel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:swissotel_dev_password}
swissotel.messaging.rabbitmq.enabled=${RABBITMQ_ENABLED:true}

services.guests.base-url=${GUESTS_SERVICE_URL:http://localhost:8082}
services.rooms.base-url=${ROOMS_SERVICE_URL:http://localhost:8083}
services.reservations.base-url=${RESERVATIONS_SERVICE_URL:http://localhost:8084}

authorization.jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Swissotel 360 Hotel Operations (Stays, Digital Keys & Service Requests) Microservice REST API
documentation.application.version=1.0.0
documentation.application.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
