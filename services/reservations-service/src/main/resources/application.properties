spring.application.name=reservations-service
server.port=${RESERVATIONS_SERVICE_PORT:8084}

spring.datasource.url=${RESERVATIONS_DB_URL:jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5433}/${LOCAL_DB_NAME:swissotel360}?currentSchema=reservations,extensions}
spring.datasource.username=${RESERVATIONS_DB_USERNAME:${LOCAL_DB_USER:swissotel}}
spring.datasource.password=${RESERVATIONS_DB_PASSWORD:${LOCAL_DB_PASSWORD:swissotel_dev_password}}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.naming.physical-strategy=com.swissotel.swissotel360.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=reservations
spring.flyway.default-schema=reservations
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

reservations.pending-hold-minutes=15
reservations.max-nights=30
reservations.expiration-job.enabled=true
reservations.expiration-job.fixed-delay-ms=60000

services.guests.base-url=${GUESTS_SERVICE_URL:http://localhost:8082}
services.rooms.base-url=${ROOMS_SERVICE_URL:http://localhost:8083}

authorization.jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Swissotel 360 Reservations Microservice REST API
documentation.application.version=1.0.0
documentation.application.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
