spring.application.name=billing-service
server.port=${BILLING_SERVICE_PORT:8086}

spring.datasource.url=${BILLING_DB_URL:jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5433}/${LOCAL_DB_NAME:swissotel360}?currentSchema=billing,extensions}
spring.datasource.username=${BILLING_DB_USERNAME:${LOCAL_DB_USER:swissotel}}
spring.datasource.password=${BILLING_DB_PASSWORD:${LOCAL_DB_PASSWORD:swissotel_dev_password}}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.naming.physical-strategy=com.swissotel.swissotel360.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=billing
spring.flyway.default-schema=billing
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:swissotel}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:swissotel_dev_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0

services.operations.base-url=${OPERATIONS_SERVICE_URL:http://localhost:8085}

authorization.jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Swissotel 360 Billing & Payments Microservice REST API
documentation.application.version=1.0.0
documentation.application.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
