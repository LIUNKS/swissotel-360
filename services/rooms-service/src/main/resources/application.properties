spring.application.name=rooms-service
server.port=${ROOMS_SERVICE_PORT:8083}

spring.datasource.url=${ROOMS_DB_URL:jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5433}/${LOCAL_DB_NAME:swissotel360}?currentSchema=rooms,extensions}
spring.datasource.username=${ROOMS_DB_USERNAME:${LOCAL_DB_USER:swissotel}}
spring.datasource.password=${ROOMS_DB_PASSWORD:${LOCAL_DB_PASSWORD:swissotel_dev_password}}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.naming.physical-strategy=com.swissotel.swissotel360.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=rooms
spring.flyway.default-schema=rooms
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

services.reservations.base-url=${RESERVATIONS_SERVICE_URL:http://localhost:8084}

authorization.jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Swissotel 360 Rooms, Rates & Availability Microservice REST API
documentation.application.version=1.0.0
documentation.application.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
