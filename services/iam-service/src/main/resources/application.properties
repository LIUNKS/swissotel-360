spring.application.name=iam-service
server.port=${IAM_SERVICE_PORT:8081}

spring.datasource.url=${IAM_DB_URL:jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5433}/${LOCAL_DB_NAME:swissotel360}?currentSchema=iam,extensions}
spring.datasource.username=${IAM_DB_USERNAME:${LOCAL_DB_USER:swissotel}}
spring.datasource.password=${IAM_DB_PASSWORD:${LOCAL_DB_PASSWORD:swissotel_dev_password}}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.naming.physical-strategy=com.swissotel.swissotel360.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.schemas=iam
spring.flyway.default-schema=iam
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7
authorization.cookie.secure=${COOKIE_SECURE:false}
authorization.cookie.same-site=${COOKIE_SAME_SITE:Lax}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080}

springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Swissotel 360 Identity and Access Management Microservice REST API
documentation.application.version=1.0.0
documentation.application.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
